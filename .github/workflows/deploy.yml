name: Deploy to polytech-profile.ru/interactive

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-interactive
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vite, base /interactive/)
        run: npm run build

      - name: Clean target directory
        # rm: true у scp-action удаляет саму папку target — deploy не может
        # (владелец /var/www — root), поэтому чистим содержимое отдельно
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            find /var/www/polytech-profile-interactive -mindepth 1 -delete

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          source: "dist/*"
          target: "/var/www/polytech-profile-interactive"
          rm: false
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo nginx -t
            sudo systemctl reload nginx
            echo "DEPLOY_DONE $(date -u)"
